name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --exclude '^https://github\.com/TheMandolorian-VK/FutureEngineers_TheDoonSchool_WRO/tree/main/(software|docs/engineering_journal/README\.md)'
            '**/*.md'
          fail: false
